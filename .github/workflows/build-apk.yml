name: Build Full Cam Astro APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore full Android source
        shell: bash
        run: |
          cat source-archive/part-{01..06}.b64 | base64 --decode > app_src.tar.xz
          echo "eceac7d3d30072122e26ae6475eca642ae8533acf86c6877d9c127f43a7af8d5  app_src.tar.xz" | sha256sum --check
          tar -xJf app_src.tar.xz
          base64 --decode camera-fix/camera-recovery.patch.gz.b64 | gunzip > /tmp/camera-recovery.patch
          echo "3459ab4f74992298deacb1709e7d991a7e97654787292e5b1088fb963adf8a0a  /tmp/camera-recovery.patch" | sha256sum --check
          patch -p1 < /tmp/camera-recovery.patch
          patch -p1 < camera-fix/long-exposure-timeout.patch
          patch -p1 < camera-fix/compile-fix.patch
          test -f app/src/main/java/com/nightskylapse/fullcamastro/CaptureService.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: new-full-cam-astro-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
