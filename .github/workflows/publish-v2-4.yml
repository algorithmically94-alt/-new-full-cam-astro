name: Publish Astro v2.4 direct APK download
on:
  push:
    paths:
      - .github/workflows/publish-v2-4.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK from verified successful v2.4 build
        uses: actions/download-artifact@v4
        with:
          name: new-full-cam-astro-v2-4-apk
          run-id: 42082502584
          github-token: ${{ github.token }}
          path: apk
      - name: Verify APK exists
        run: |
          ls -lah apk
          test -s apk/app-debug.apk
          unzip -t apk/app-debug.apk | tail -n 2
      - name: Publish direct APK as GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.4 "apk/app-debug.apk#new_full_cam_astro_v2_4.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "New Full Cam Astro v2.4 — Camera Pipeline Fix" \
            --notes "Signed debug APK generated by the successful GitHub Actions Android build. Camera2 pipeline, Gallery JPEG saving, and capture reliability updates. Camera performance still requires device testing." \
            --latest
